name: ci

on:
  push:
    branches:
      - main
      - cursor/mac-dev
      - "agent/**"
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # Several unit tests import @workspace/db, which throws if this is unset.
      # The suite does not connect. Not a real database.
      DATABASE_URL: postgres://ci:ci@127.0.0.1:5432/ci
      BASE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
      HEAD_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Secret scan
        run: |
          curl -fsSL -o /tmp/gitleaks.tar.gz https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          tar -xzf /tmp/gitleaks.tar.gz -C /tmp gitleaks
          # Tree at this commit, not all historical commits. See .gitleaks.toml.
          /tmp/gitleaks detect --no-git --source . --redact --config .gitleaks.toml
          if [ -n "$BASE_SHA" ] && ! printf '%s' "$BASE_SHA" | grep -Eq '^0+$'; then
            /tmp/gitleaks detect --redact --config .gitleaks.toml --log-opts="${BASE_SHA}..${HEAD_SHA}"
          else
            echo "secret scan: no base sha, tree scan only"
          fi

      - name: Protected files, Agent trailer, schema migration, A145 gates 7–8
        env:
          PR_BODY: ${{ github.event.pull_request.body || '' }}
        run: node --test scripts/ci-guards.test.mjs && node scripts/ci-guards.mjs

      - run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Test api-server (unit)
        run: pnpm --filter @workspace/api-server test

      - name: Test stock-compare (unit)
        run: pnpm --filter @workspace/stock-compare test

      - name: Detect path filters (A145)
        id: paths
        run: |
          if [ -z "$BASE_SHA" ] || printf '%s' "$BASE_SHA" | grep -Eq '^0+$'; then
            echo "api=true" >> "$GITHUB_OUTPUT"
            echo "ui=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          files=$(git diff --name-only "$BASE_SHA" "$HEAD_SHA" || true)
          echo "$files" | grep -qE '^(artifacts/api-server/|lib/)' && echo "api=true" >> "$GITHUB_OUTPUT" || echo "api=false" >> "$GITHUB_OUTPUT"
          echo "$files" | grep -qE '^artifacts/stock-compare/' && echo "ui=true" >> "$GITHUB_OUTPUT" || echo "ui=false" >> "$GITHUB_OUTPUT"

      - name: Build api-server (A145 gate 6)
        if: steps.paths.outputs.api == 'true'
        run: pnpm --filter @workspace/api-server build

      - name: Build stock-compare (A145 gate 6)
        if: steps.paths.outputs.ui == 'true'
        run: pnpm --filter @workspace/stock-compare build

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Python watchlist_sync tests (A145 gate 5)
        working-directory: scripts/watchlist_sync
        run: |
          pip install -r requirements.txt
          python -m unittest tests.test_forecast_ledger tests.test_dealer_gamma tests.test_openjev_local

      - name: NEEDS YOU inbox delivery
        run: node --test .agents/hooks/needs-inbox.test.mjs

      - name: ASKS index
        run: node --test scripts/check-asks-index.test.mjs && node scripts/check-asks-index.mjs
