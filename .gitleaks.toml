title = "fildi"
# Default rules. Allowlist is verified false positives only (column keys and one field-map name).

[extend]
useDefault = true

[allowlist]
description = "Verified false positives. Column/field identifiers + app_config key names (not credentials). Convention: app_config keys named *_KEY / aNNN_*_attempts trip generic-api-key — allowlist the key string, do not invent a new secret."
regexTarget = "line"
regexes = [
  '''epsDrift30dPct''',
  '''priceVsMa20Atr''',
  '''priceVsMa50Atr''',
  '''finnhubLongTermDebtToEquity''',
  # app_config keys (earnings-history.ts, ASKS A242) — not API credentials
  '''a240_missing_upcoming_empty_attempts''',
  # CLAUDE.md factor names (gitleaks generic-api-key false positive on "Key replacements: …")
  '''earningsYield\+fcfYield''',
]
